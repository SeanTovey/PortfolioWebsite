<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal portfolio website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Portfolio | Sean Tovey</title>
</head>

<body>

  <header>
    <nav aria-label="Primary navigation">
      <div class="header-brand">
        <a href="index.html">Sean Tovey</a>
      </div>
      <ul>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <div class="banner-area">
    <figure class="website-banner">
      <video autoplay loop muted playsinline tabindex="0" role="button" aria-label="Pause or play banner video">
        <source src="Videos/VideoBanner.mp4" type="video/mp4">
      </video>
    </figure>

    <section id="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <h1 id="hero-title">Sean Tovey</h1>
        <p id="hero-subtitle">3D Environment Artist & Game Designer</p>
      </div>
    </section>
  </div>

  <main>

    <!-- <section id="about" aria-labelledby="about-title">
      <h2 id="about-title">About me</h2>
      <p>Add a short introduction about yourself, your skills, and your experience here.</p>
    </section> -->

    <section id="projects" aria-labelledby="projects-title">
      <h2 id="projects-title">Projects</h2>
      <div class="project-grid">
        <a class="project-card" href="project-one.html">
          <img src="Images/Thumbnail_DreamParasite.png" alt="Dream Parasite project thumbnail">
          <h3>Dream Parasite</h3>
        </a>
        <a class="project-card" href="project-two.html">
          <img src="Images/Thumbnail_Lighthouse.png" alt="Lighthouse project thumbnail">
          <h3>Lighthouse Keeper</h3>
        </a>
        <a class="project-card" href="project-three.html">
          <img src="Images/Thumbnail_EleventhPlanet.png" alt="Eleventh Planet project thumbnail">
          <h3>Eleventh Planet</h3>
        </a>
        <a class="project-card" href="project-four.html">
          <img src="Images/Thumbnail_SmallProjects.png" alt="Small Projects thumbnail">
          <h3>Small Projects</h3>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <!-- <p>&copy; 2026 Sean Tovey</p> -->
  </footer>

  <script>
    const bannerVideo = document.querySelector(".website-banner video");

    function toggleBannerVideo() {
      if (bannerVideo.paused) {
        bannerVideo.play();
      } else {
        bannerVideo.pause();
      }
    }

    bannerVideo.addEventListener("click", toggleBannerVideo);
    bannerVideo.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleBannerVideo();
      }
    });
  </script>

</body>
</html>
