<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Project Four by Sean Tovey">
  <link rel="stylesheet" href="styles.css">
  <title>Small Projects | Sean Tovey</title>
</head>

<body>
  <header>
    <nav aria-label="Primary navigation">
      <div class="header-brand">
        <a href="index.html">Sean Tovey</a>
      </div>
      <ul>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="project-layout" aria-labelledby="project-title">
      <div class="project-heading">
        <h1 id="project-title" class="project-page-title">Small Projects</h1>
      </div>
      <div class="project-copy">
        <p id="Project-Summary">Project summary goes here.
          <br>My role, tools used, and final result go here.<br>
          <br>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
        </p>
      </div>
      <div class="project-media">
        <div class="project-gallery" aria-label="Project Four project images">
          <figure class="project-gallery-item">
            <img src="Images/SmallProjects/Shadow_1.png" alt="Small project: Shadow, image 1" tabindex="0">
            <figcaption>Shadow — image 1</figcaption>
          </figure>
          <figure class="project-gallery-item">
            <img src="Images/SmallProjects/Shadow_2.png" alt="Small project: Shadow, image 2" tabindex="0">
            <figcaption>Shadow — image 2</figcaption>
          </figure>
          <figure class="project-gallery-item">
            <img src="Images/SmallProjects/Kitchen_3.png" alt="Small project: Kitchen" tabindex="0">
            <figcaption>Kitchen</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <dialog class="image-lightbox" aria-label="Enlarged project image">
    <img src="" alt="">
  </dialog>

  <footer class="project-footer">
    <a class="project-back-link" href="index.html#projects">Back to projects</a>
  </footer>

  <script>
    const lightbox = document.querySelector(".image-lightbox");
    const lightboxImage = lightbox.querySelector("img");

    document.querySelectorAll(".project-gallery-item > img").forEach((image) => {
      const openLightbox = () => {
        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;
        lightbox.showModal();
      };

      image.addEventListener("click", openLightbox);
      image.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openLightbox();
        }
      });
    });

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) lightbox.close();
    });
  </script>
</body>
</html>
